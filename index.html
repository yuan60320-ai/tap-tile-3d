<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Tap Tile 3D</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, "Microsoft YaHei", sans-serif; background: #9cc9ec; }
    #app { position: fixed; inset: 0; }
    #tray { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); display: flex; gap: 4px; padding: 6px; border-radius: 10px; background: #b3262d; box-shadow: 0 4px 12px rgba(0,0,0,.25); }
    #tray .slot { width: 40px; height: 40px; border-radius: 6px; background: rgba(0,0,0,.25); display: flex; align-items: center; justify-content: center; font-size: 26px; }
    #status { position: fixed; left: 12px; bottom: 12px; color: #1d2b3a; background: rgba(255,255,255,.7); padding: 6px 10px; border-radius: 6px; font-size: 14px; max-width: 60vw; }
    #panel { position: fixed; right: 0; top: 0; bottom: 0; width: 280px; overflow-y: auto; background: rgba(255,255,255,.92); padding: 8px 12px 24px; box-sizing: border-box; font-size: 13px; color: #1d2b3a; }
    #panel h3 { margin: 14px 0 6px; font-size: 14px; border-bottom: 1px solid #d7e0ea; padding-bottom: 4px; }
    #panel .row { display: grid; grid-template-columns: 1fr 110px 44px; align-items: center; gap: 6px; margin: 4px 0; }
    #panel .row.color { grid-template-columns: 1fr 60px; }
    #panel .row.bool { grid-template-columns: 1fr 24px; }
    #panel .row.action { grid-template-columns: 1fr; }
    #panel button { padding: 6px 8px; border: 1px solid #b8c4d2; border-radius: 6px; background: #fff; cursor: pointer; }
    #panel button:hover { background: #eef4fb; }
    #panel output { text-align: right; font-variant-numeric: tabular-nums; }
    #panel input[type=range] { width: 100%; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="tray"></div>
  <div id="status">加载中…</div>
  <aside id="panel"></aside>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./game.js"></script>
</body>
</html>
